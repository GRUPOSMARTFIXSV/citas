.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

let REG={k:null,estado:null,carros:[],fact:null};
// "Ya me cotizaron" por número (Gustavo 02/11/2026): la cotización de HIVE va a nombre del cliente y su carro (aunque los datos se hayan pedido por WhatsApp).
// cotizaciones/<n> guarda `pl` (placa de la unidad); con ella se busca el registro y se verifica con código al WhatsApp registrado.
// PENDIENTE DE DESARROLLAR (Gustavo 02/11/2026): conectar la API de WhatsApp (Cloud API con coexistencia) en el servidor (Supabase)
// para que, al cotizar por WhatsApp, se cree SOLO el cliente y la unidad en HIVE con los datos y la foto de la tarjeta que mandó el cliente por el chat.
let CQ={n:null,estado:null};
async function cotiACliente(n){CQ={n,estado:'buscando'};render();let pl='';try{const d=db?await db.doc('cotizaciones/'+n).get():null;if(d&&d.exists)pl=String(d.data().pl||'')}catch(_){}
  if(CQ.n!==n)return;if(pl){st.carro.placaRef=pl;CQ.estado='ok'}else CQ.estado='no';render()}
function carrosRegistrados(){if(window.CARROS_HIVE)return window.CARROS_HIVE;return REG.estado==='ok'?REG.carros:[]}
// Búsqueda "abierta" (Gustavo 02/11/2026): acepta un error en la placa (una letra/número, sin la P inicial, O por 0) si el WhatsApp es el mismo,
// o un error en el WhatsApp si la placa es exacta. Nunca muestra carros si fallan las dos cosas. En producción, además, código por WhatsApp.
const plN=p=>normPlaca(p).replace(/O/g,'0').replace(/I/g,'1');
function distPlaca(a,b){a=plN(a);b=plN(b);if(a===b)return 0;const sa=a.replace(/^[A-Z]+(?=\d)/,''),sb=b.replace(/^[A-Z]+(?=\d)/,'');if(sa&&sa===sb)return 0.5;return lev(a,b)}
async function buscarRegistrados(){const c=st.carro;const wa=waIntl(c).replace(/\D/g,'');const porWa=c.buscarPor==='wa';const k=porWa?'wa|'+wa:'pl|'+normPlaca(c.placaRef);if(REG.k===k)return;REG={k,estado:'buscando',carros:[],fact:null,aviso:'',wa:null,nombre:''};st.verif=null;
  if(PUBLICO){try{const r=await srv('buscar',{placa:c.placaRef});if(REG.k!==k)return;REG.estado=r.estado==='ok'?'ok':'no';REG.waMask=r.waMask||'';REG.origen=r.origen||''}catch(_){REG.estado='sin'}render();return}
  if(!db){REG.estado='sin';render();return}
  try{const snap=await db.collection('registrados').get();if(REG.k!==k)return;let mejor=null;
    snap.docs.forEach(d=>{const x=d.data();const dist=porWa?lev(d.id,wa):Math.min(...(x.carros||[]).map(y=>distPlaca(y.placa,c.placaRef)),9);
      if(dist<=1&&(!mejor||dist<mejor.dist))mejor={dist,x,id:d.id,pl:porWa?null:(x.carros||[]).reduce((a,y)=>distPlaca(y.placa,c.placaRef)<distPlaca(a,c.placaRef)?y.placa:a,(x.carros[0]||{}).placa)}});
    // Cliente y unidad se crean en HIVE hasta que AGENDA (Gustavo 02/11/2026). Mientras, "Ya me cotizaron" lo encuentra en sus solicitudes de cotización guardadas.
    // En producción esta búsqueda la hace el servidor (en el prototipo `citas` se puede leer).
    if(!mejor&&st.cotizado){try{const sq=await db.collection('citas').get();if(REG.k!==k)return;sq.docs.forEach(d=>{const x=d.data();if(x.estado!=='pidio_cotizacion'||!x.carro)return;const cr=x.carro;const id=String(cr.waIntl||'').replace(/\D/g,'');
        const dist=porWa?lev(id,wa):distPlaca(cr.placa,c.placaRef);if(dist<=1&&(!mejor||dist<mejor.dist))mejor={dist,id,pl:cr.placa,x:{carros:[{marca:cr.marca,modelo:cr.modelo,anio:cr.anio,color:cr.color,placa:cr.placa,vin:cr.vin,motor:cr.motor}],facturacion:{nombre:(cr.nombre+' '+cr.apellido).trim(),tipo:'Factura',correo:'',doc:'',origen:'solicitud'}}}})}catch(_){}}
    if(!mejor){REG.estado='no'}else{REG.estado='ok';REG.carros=mejor.x.carros||[];REG.fact=mejor.x.facturacion||null;REG.wa=mejor.id;REG.nombre=(mejor.x.facturacion||{}).nombre||mejor.x.nombre||'';
      REG.aviso=mejor.dist>0?(porWa?'Tu número es un poco distinto al que tenemos.':'Tu placa se parece a '+mejor.pl+'.'):''}}
  catch(e){REG.estado='sin'}render()}
// El VIN dice la marca (primeros 3 caracteres, WMI). Sirve para detectar una tarjeta o un VIN de OTRO carro (Gustavo 02/11/2026).
const WMI=[['KNA KNB KNC KND KNE KNM 3KP 5XX 5XY U5Y U6Y MS0','Kia'],['KMH KM8 KMF KMJ 5NP 5NM 5NT 3KM TMA MAL','Hyundai'],['JT 4T 5T 2T 3TM 6T1 8AJ MR0 MR1 MR2 AHT NMT','Toyota'],['JN 1N4 1N6 3N1 3N6 3N8 5N1 5N3 MNT VSK','Nissan'],['JHM JHL 1HG 2HG 5FN 5J6 5J8 19X 2HK 3CZ MAK MRH','Honda'],['JA3 JA4 JA7 JMY JE3 ML3 MMB MMC','Mitsubishi'],['JM1 JM3 JM7 3MZ 3MD MM0 MM6','Mazda'],['JS1 JS2 JS3 JSA MA3 TSM','Suzuki'],['1FA 1FM 1FT 1FD 2FM 3FA 3FM MAJ MNB','Ford'],['1G1 1GN 1GC 2G1 3GN 3GC KL1 KL7 9BG','Chevrolet'],['1C4 1J4 1J8 3C4 ZAC','Jeep'],['WVW WV1 WV2 3VW 9BW','Volkswagen'],['WBA WBS WBX 5UX','BMW'],['WDD WDB WDC W1K W1N 4JG','Mercedes-Benz'],['WAU WA1','Audi'],['JF1 JF2 4S3 4S4','Subaru'],['LGX LGW L6T','BYD'],['LVV LVT LVR','Chery'],['LGJ LJ1 LGB','Great Wall'],['LZW LSG','Chevrolet']];
function marcaVin(v){v=String(v||'').toUpperCase();for(const [l,m] of WMI)for(const w of l.split(' '))if(v.startsWith(w))return m;return null}
const nMarca=x=>normQ(String(x||'')).replace(/\b(motors?|motor company|corporation|corp|co)\b/g,'').replace(/mercedes benz/,'mercedes-benz').trim();
const mismaMarca=(a,b)=>{a=nMarca(a);b=nMarca(b);return !a||!b||a===b||a.includes(b)||b.includes(a)};
// Conflicto del VIN con la marca del carro (el cliente puede decir que el VIN sí es correcto)
const avisoVin=c=>`<div class="alert bad">Este VIN es de un <b>${esc(marcaVin(c.vin))}</b>, pero tu carro es <b>${esc(c.marca)}</b>. Revisa que el VIN o la tarjeta sean de este carro.<div class="row" style="margin-top:6px"><button type="button" class="btn" data-vinok="1">Sí, el VIN es correcto</button></div></div>`;
function vinConflicto(c){if(!vinOk(c.vin)||c.vinMarcaOk)return null;const m=marcaVin(c.vin);return m&&c.marca&&!mismaMarca(m,c.marca)?m:null}
const vinOk=v=>/^[A-HJ-NPR-Z0-9]{17}$/.test(String(v||'').toUpperCase().trim());
const waMask=id=>{id=String(id||'');return id.startsWith('503')?'+503 ••••-••'+id.slice(-2):'+'+id.slice(0,id.length-8)+' ••••••'+id.slice(-2)};

function tituloCalendar(x){return (x.estado==='confirmada'?'🟢 ':x.confirmacion&&x.confirmacion.enviada?'🟡 ':'')+tituloCalendar0(x)}
function tituloCalendar0(x){const s=srvCita(x)||{};const L=s.lista||[s];const ac=x.aceites||{};const serv=L.map(y=>String(y.n||'').toUpperCase()+(ACE_MOTOR.includes(y.id)&&ac.motor?' ('+(ac.motor+(ac.motorDetalle&&ac.motorDetalle!=='el recomendado por SmartFix'?' '+ac.motorDetalle:' RECOMENDADO')).toUpperCase()+')':ACE_CAJA.includes(y.id)&&ac.caja?' ('+ac.caja.toUpperCase()+')':'')).join(' + ');const otraMarca=(x.aceites&&((x.aceites.motor&&x.aceites.motor!=='Valvoline')||(x.aceites.caja&&x.aceites.caja!=='Valvoline')));const pw=String((x.carro||{}).precioWa||'').trim();const pr=pw?' '+(pw.startsWith('$')?pw:'$'+pw)+' (PRECIO POR WHATSAPP)':otraMarca?' COTIZAR PRECIO':x.acepta&&s.precio?' '+String(s.precio).replace(/ en total$/,''):'';

// ---------- PDF → imagen de la primera página (para leer tarjetas enviadas en PDF) ----------
function cargarPdfJs(){if(window.pdfjsLib)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()}catch(e){rej(e)}};
    s.onerror=()=>rej(new Error('pdf'));document.head.appendChild(s)})}
async function aImagen(file){if(!(/\.pdf$/i.test(file.name)||file.type==='application/pdf'))return file;
  await cargarPdfJs();const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await pdf.getPage(1);
  const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return await new Promise(r=>c.toBlob(r,'image/png'))}
